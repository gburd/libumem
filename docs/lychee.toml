# lychee link-checker configuration for the libumem docs.
# Used by the Docs CI workflow: it builds the Jekyll site and checks
# every link in the generated HTML.

# Treat these as success (many hosts rate-limit HEAD from CI).
accept = [200, 206, 429]

# Verify internal anchors (#fragment) resolve.  A recent lychee changed
# this key from a bool to a string enum ("full" enables anchor + text
# fragment checking, equivalent to the old `true`); the CI action floats
# to the latest lychee release, so match its current schema here.
include_fragments = "full"

# Reasonable timeout + retries for flaky external hosts.
timeout = 20
max_retries = 2
retry_wait_time = 2

# Don't fail the build on external hosts that block CI scrapers or are
# frequently rate-limited.  Internal links (relative + the site's own
# URLs) are always checked.
exclude = [
    # localhost / example placeholders
    "^https?://localhost",
    "^https?://127\\.0\\.0\\.1",
    # Wikipedia and shields.io rate-limit / block HEAD from CI runners
    "^https://en\\.wikipedia\\.org",
    "^https://img\\.shields\\.io",
    # The Doxygen API reference (/api) is generated by a separate build
    # step and verified there, not by this Jekyll-only link pass.
    "/api/?$",
    "/api/",
    # GitHub/Codeberg anchor deep-links into blob line ranges are not
    # fetchable as anchors by lychee
    "codeberg\\.org/.*/src/branch/master/.*#",
]

# Do not check mailto: or other non-http schemes.
scheme = ["https", "http"]
