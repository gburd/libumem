# Jekyll configuration for the libumem documentation site.
#
# Builds on both GitHub Pages and Codeberg Pages.  The rendered API
# reference (Doxygen) is generated into api/ and linked from the nav.
#
# Local preview:
#   cd docs && bundle install && bundle exec jekyll serve

title: libumem
description: >-
  A portable port of the Solaris userspace slab + magazine allocator:
  object caches with constructor/destructor callbacks, vmem address
  arenas, a lock-free per-thread cache, and first-class runtime heap
  debugging (umem/umemctl/gdb/lldb) on Linux, FreeBSD, and macOS.
lang: en

# just-the-docs: a reference + guide theme with search and side nav.
# Used as a gem theme (no remote fetch, no openssl needed at build time);
# both Pages builders and a local `bundle exec jekyll build` resolve it.
theme: just-the-docs

# Diagrams: just-the-docs renders ```mermaid fenced blocks client-side.
mermaid:
  version: "10.9.1"

# Default page layout: our hero-styled wrapper (big title + lede), so
# every content page carries the landing-page look.
defaults:
  - scope:
      path: ""
    values:
      layout: content

# Site-relative base path.  Both GitHub Pages (user.github.io/libumem)
# and Codeberg Pages (user.codeberg.page/libumem) serve under /libumem.
baseurl: "/libumem"

# Search across all pages.
search_enabled: true
search:
  heading_level: 3
  previews: 3

# Code highlighting.
highlighter: rouge
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  input: GFM
  hard_wrap: false

# just-the-docs nav ordering uses front-matter `nav_order`.
heading_anchors: true

# Footer: a back-to-top link; the nav-panel footer links (Codeberg /
# GitHub) come from _includes/nav_footer_custom.html, which also removes
# the theme's default "Just the Docs" attribution line.
back_to_top: true
back_to_top_text: "Back to top"

# Footer / repo links (rendered by the theme).
aux_links:
  "Source (Codeberg)":
    - "https://codeberg.org/gregburd/libumem"
  "Mirror (GitHub)":
    - "https://github.com/gburd/libumem"
  "API reference (Doxygen)":
    - "/libumem/api/"

# Callout styles used by the book (note / rationale / not-chosen /
# warning).  Content pages open these with just-the-docs' callout
# syntax, e.g.  {: .warning } before a blockquote.
callouts:
  note:
    title: Note
    color: blue
  rationale:
    title: Why this way
    color: green
  not_chosen:
    title: Alternative not chosen
    color: yellow
  warning:
    title: Careful
    color: red

# Files Jekyll must not try to render or copy.
exclude:
  - Doxyfile
  - api/               # Doxygen output is copied in at deploy time
  - vendor/
  - Gemfile
  - Gemfile.lock
  - gen_api_reference.sh
  - check_mermaid.sh
  - lychee.toml
  - "*.3"
  - "*.7"
  # Internal working documents: plans, reviews, raw results.  These are
  # durable under version control (AGENTS.md section 8) but are not site
  # pages; the design/ and reference/ pages lift from them.
  - plans/
  - reviews/
  - results/
  - UMEMCTL.md
