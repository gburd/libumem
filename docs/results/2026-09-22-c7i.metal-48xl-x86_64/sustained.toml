instance_type = "c7i.metal-48xl"
arch = "x86_64"
vcpu = 192
threads = 192
governor = "performance"
duration_target_sec_per_window = 15
windows_per_allocator = 4
warmup_windows_discarded = 1
allocators = ["libc","umem"]
order = "interleaved"
git_sha = "40d73e54d01f163784d5284e62d92b813d0dc367"
