# numactl: node distances:
# numactl: node     0    1 
# numactl:    0:   10  100 
# numactl:    1:  100   10 
thread_stack_usable_bytes = 8317599
duration_target_sec_per_window = 60
windows_per_allocator = 10
warmup_windows_discarded = 5
mode = "continuous"
# continuous: one process per (allocator, workload); each [[window]]
# is one DURATION-second interval of it; intervals 0..WARMUPS-1 ran
# and were not printed.  Every column is per-interval, including
# vmhwm_bytes (= that interval's max VmRSS sampled every 100 ms, not
# the process VmHWM, which would include the dropped warm-up).
interval_sec = 60
intervals_per_run = 15
frag_pool_objects_per_thread = 100000
numa_policy = "numactl --interleave=all"
frag_sizes = "64:256"
prodcons_sizes = "64:256"
