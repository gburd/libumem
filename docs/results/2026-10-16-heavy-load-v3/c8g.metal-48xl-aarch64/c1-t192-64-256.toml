instance_type = "c8g.metal-48xl"
arch = "aarch64"
vcpu = 192
threads = 192
governor = "unknown"
glibc_tunables = "glibc.rtld.optional_static_tls=65536"
umem_options = ""
config_h_rseq = "#define HAVE_LINUX_RSEQ_H 1"
os_release = "Debian GNU/Linux 13 (trixie) (13.7)"
kernel = "6.12.111+deb13-cloud-arm64"
thp = "always madvise [never]"
numa_balancing = "0"
vm_max_map_count = "1048576"
