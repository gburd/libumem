# libumem allocator scaling matrix
# instance=c7i.metal-48xl arch=x86_64 vcpu=192 governor=performance pinned=1
# columns mirror bench CSV: ops_per_sec, latency percentiles (ns),
# peak_rss_bytes, ops_cov (stddev/mean over 1 runs), unstable flag.
#
# UNITS (P2.1/P2.2 -- read before comparing to anything published
# before 2026-09-22, which used different and partly wrong ones):
#   total_ops           operations completed, summed over ALL threads
#   ops_per_thread      total_ops / threads, as actually run
#   threads             threads that RAN (may differ from requested)
#   frag                rss_at_live_peak / live_bytes_at_peak, both
#                       sampled at the SAME instant, at the LIVE-SET
#                       PEAK (not at the worst ratio: maximising the
#                       ratio finds the smallest denominator, which
#                       once reported 505x while implied RSS was flat
#                       at ~1.1GB).  frag_median summarises the
#                       sampled series.  Absent for workloads with no
#                       live set, or too few samples.  Read the PAIR
#                       and vmhwm, never the quotient alone.
#   ops_floor_raised    true => the per-thread budget was below the
#                       minimum and was raised; the point ran MORE
#                       work than -n asked for.
