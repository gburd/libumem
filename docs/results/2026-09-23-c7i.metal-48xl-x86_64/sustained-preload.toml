# that window's own latency percentiles and its own RSS/live-bytes
# pair.  Windows for the named allocators INTERLEAVE (A,B,A,B,...)
# so drift over the run does not masquerade as a difference between
# allocators.  Not comparable to sustained.toml files written before
# 2026-09-22: those aggregate a whole run and their frag column is a
# different (and wrong) quantity.  See P2.1/P2.2 in
# docs/plans/2026-09-21-production-readiness.md.
