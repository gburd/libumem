instance_type = "c8g.metal-48xl"
arch = "aarch64"
vcpu = 192
git_sha = "f2a8267df7586db9e5e6b7dd052bda90e5cea571"
operations_total_per_point = 19200000

[[point]]
allocator = "libc"
workload = "frag"
