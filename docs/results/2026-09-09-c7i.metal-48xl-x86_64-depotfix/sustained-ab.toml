# sustained prodcons depot-fix A/B (192 threads, 180s target, size 64:256)
# instance: c7i.metal-48xl (dedicated single-tenant verification instance,
# same AMI/tuning as launch.sh intel-hi, tag Role=intel-hi-verify-depotfix,
# terminated after this verification), x86_64.
# baseline = HEAD (umem_depot_alloc unbounded blocking scan).
# fixed    = umem_depot_alloc scan changed from umem_depot_pop (blocking)
#            to umem_depot_pop_trylock (non-blocking), same full scan breadth.
# Runs alternated baseline/fixed on the same box, back to back, idle-load
# verified between runs (uptime 1-min avg < 10 before each run).
instance_type = "c7i.metal-48xl"
arch = "x86_64"

[[sustained]]
variant = "baseline"
run = 1
allocator = "umem"
workload = "prodcons-sustained"
threads = 192
size = "64:256"
ops = 325141440
elapsed_sec = 163.897179
ops_per_sec = 1983813.52
lat_p50 = 529
lat_p90 = 5118
lat_p99 = 20820
lat_p999 = 156736
lat_max = 44905713
peak_rss_bytes = 181440512

