# bench_contention -w prodcons -t 192 -n 40000000 -s 64:256 counter dumps,
# baseline (unbounded blocking depot scan) vs. fixed (non-blocking scan,
# same full breadth). Same dedicated c7i.metal-48xl verification instance.
# The key columns: dep_remote (successful cross-CPU steal hits) stays
# proportionally high in both; dep_conten (trylock-fail -> blocking-lock
# fallback count, baseline only, since fixed never blocks) collapses by
# ~60-100x for the hot alloc_* caches -- this is the direct evidence for
# the lock-convoy mechanism and its fix.

[baseline]
# umem prodcons t=192 size=64:256 ops=79999872 (from the earlier full
# 190M-op / ~180s sustained perf-capture run on intel-hi, same code path)
# cache               cc_alloc  dep_local  dep_remote  dep_conten
# umem_alloc_96        9518758       1014      122521       89167
# umem_alloc_112       9503308       1002      122482       83651
# umem_alloc_128       9501958        980      122521       85844
# umem_alloc_160      19028902       1351      246193      152175
# umem_alloc_192      19037660       1346      246265      142560
# umem_alloc_224      19041919       1341      246177      147385
# umem_alloc_256      19002516       1370      246143      152217
# umem_alloc_320       8898090       1300      114849      117799

[fixed]
# same workload, shorter run (40M ops, ~20s) on the fixed binary:
# cache               cc_alloc  dep_local  dep_remote  dep_conten
# umem_alloc_96        1968751        604       25253         667
# umem_alloc_112       1959523        623       25201         828
# umem_alloc_128       1964419        620       25230         799
# umem_alloc_160       3896648        657       51300        2419
# umem_alloc_192       3914135        650       51268        1867
# umem_alloc_224       3900855        664       51267        1166
# umem_alloc_256       3912981        674       51284        1246
# umem_alloc_320       1848387        614       23625         578
#
# contention-per-remote-steal ratio (dep_conten / dep_remote), the signal
# that isolates "how often does a steal attempt block" independent of run
# length: baseline ~0.6-1.05 (umem_alloc_256: 152217/246143 = 0.618);
# fixed ~0.024 (umem_alloc_256: 1246/51284 = 0.0243) -- roughly a 25x drop
# in blocking-fallback rate per successful steal, consistent with the
# collapse in the raw dep_conten counts above (~60-100x over the longer
# baseline run, where sustained duration lets more concurrent misses
# overlap into a convoy).
