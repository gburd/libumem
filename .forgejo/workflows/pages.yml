name: Deploy Codeberg Pages

# Builds the Jekyll documentation site (docs/) plus the Doxygen API
# reference (into /api) and deploys to Codeberg Pages.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'umem.h'
      - 'umem_inspect.h'
      - 'umem_own.h'
      - 'umem_profile.h'
      - 'umem_hooks.h'
      - 'umem.1'
      - '*.3'
      - '*.7'
      - '.forgejo/workflows/pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: codeberg-small
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen mandoc ruby-full build-essential

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Generate API reference from man pages
        run: sh docs/gen_api_reference.sh

      - name: Build Jekyll site
        working-directory: docs
        env:
          JEKYLL_ENV: production
          BUNDLE_PATH: vendor/bundle
        run: |
          bundle config set --local path vendor/bundle
          bundle install
          bundle exec jekyll build --destination _site

      - name: Build Doxygen API reference
        working-directory: docs
        run: |
          doxygen Doxyfile 2>../doxygen-warnings.txt || true
          echo "Doxygen produced $(wc -l < ../doxygen-warnings.txt) warning lines"
          mkdir -p _site/api
          if [ -d api/html ]; then cp -r api/html/* _site/api/; fi

      - name: Verify site contents
        working-directory: docs
        run: |
          test -s _site/index.html
          grep -q -i 'libumem' _site/index.html
          echo "Jekyll site built ($(find _site -type f | wc -l) files)"

      - name: Check documentation links (lychee)
        working-directory: docs
        run: |
          # Build a copy with an empty baseurl so root-relative links
          # resolve locally, then check every link and anchor.
          bundle exec jekyll build --baseurl "" --destination _site_check
          LYCHEE_VER=v0.15.1
          curl -sSL "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VER}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz lychee
          ./lychee --config lychee.toml --no-progress \
            --root-dir "$PWD/_site_check" '_site_check/**/*.html' ../README.md ../SECURITY.md

      - name: Check mermaid diagrams
        run: |
          # npx (bundled with Node) fetches mermaid-cli on demand.
          command -v npx >/dev/null 2>&1 || sudo apt-get install -y nodejs npm
          sh docs/check_mermaid.sh

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: 'https://${{ forge.repository_owner }}.codeberg.page/libumem/'
          token: ${{ forge.token }}
          source: docs/_site/
