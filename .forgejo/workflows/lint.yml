# Forgejo Actions: lint + portability sanity checks.
#
# Quick checks that catch regressions without needing a full build.

name: lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: docker
    container:
      image: codeberg.org/forgejo-contrib/forgejo-runner-debian:bookworm
    steps:
      - name: Install
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends shellcheck
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          # Tools and tests.
          shellcheck \
            tools/umem \
            test/debugger/test_inspect_e2e.sh \
            test/debugger/test_lldb_e2e.sh \
            scripts/*.sh

  python-syntax:
    name: python syntax
    runs-on: docker
    container:
      image: codeberg.org/forgejo-contrib/forgejo-runner-debian:bookworm
    steps:
      - name: Install
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip
          python3 -m pip install --break-system-packages pyflakes
      - uses: actions/checkout@v4
      - name: Compile-check Python sources
        run: |
          python3 -m py_compile \
            tools/gdb/umem_gdb.py \
            tools/lldb/umem_lldb.py \
            tools/umem_dump_reader
      - name: pyflakes
        run: |
          # Allow undefined-name for `gdb` and `lldb` (provided by host).
          pyflakes tools/umem_dump_reader || true
          # gdb/lldb scripts run inside the debugger so report-only.
          pyflakes tools/gdb/umem_gdb.py 2>&1 \
            | grep -v "undefined name 'gdb'" || true
          pyflakes tools/lldb/umem_lldb.py 2>&1 \
            | grep -v "undefined name 'lldb'" || true

  manpage-syntax:
    name: man-page lint
    runs-on: docker
    container:
      image: codeberg.org/forgejo-contrib/forgejo-runner-debian:bookworm
    steps:
      - name: Install
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends groff-base mandoc
      - uses: actions/checkout@v4
      - name: Validate man pages
        run: |
          # mandoc -Tlint catches the kinds of macro mistakes that
          # render badly on at least one common pager.
          for m in *.1 *.3 *.7; do
            [ -f "$m" ] || continue
            echo "== $m =="
            mandoc -Tlint "$m" || exit 1
          done
