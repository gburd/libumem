name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-matrix:
    name: Test (${{ matrix.os }}, ${{ matrix.arch }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        arch: [amd64]
        mode: [normal, asan, ubsan, coverage]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool \
            lcov \
            valgrind

      - name: Generate configure
        run: |
          autoreconf -fvi

      - name: Configure (normal)
        if: matrix.mode == 'normal'
        run: ./configure

      - name: Configure (coverage)
        if: matrix.mode == 'coverage'
        run: ./configure --enable-coverage

      - name: Configure (asan)
        if: matrix.mode == 'asan'
        run: ./configure --enable-asan
        env:
          ASAN_OPTIONS: detect_leaks=1:check_initialization_order=1

      - name: Configure (ubsan)
        if: matrix.mode == 'ubsan'
        run: ./configure --enable-ubsan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

      - name: Build
        run: make -j$(nproc)

      - name: Run tests
        run: make check

      - name: Generate coverage report
        if: matrix.mode == 'coverage'
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/test/*' --output-file coverage_filtered.info
          lcov --list coverage_filtered.info

      - name: Upload coverage to Codecov
        if: matrix.mode == 'coverage'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage_filtered.info
          fail_ci_if_error: false

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}
          path: |
            **/*.log
            test-suite.log

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool

      - name: Generate configure
        run: autoreconf -fvi

      - name: Build
        run: |
          ./configure
          make -j$(nproc)

      - name: Build benchmarks
        run: |
          cd test/bench
          make -j$(nproc)

      - name: Run quick benchmark
        run: |
          cd test/bench
          ./bench_allocators.sh -q umem

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: test/bench/results/*.csv

  valgrind:
    name: Valgrind Memory Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool \
            valgrind

      - name: Generate configure
        run: autoreconf -fvi

      - name: Build
        run: |
          ./configure CFLAGS="-g -O0"
          make -j$(nproc)

      - name: Run tests under valgrind
        run: |
          make check-valgrind || echo "Valgrind found issues (expected for allocator)"
        continue-on-error: true

  nix-build:
    name: Nix Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [libumem, libumem-riscv64, libumem-aarch64]

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: libumem
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true

      - name: Build ${{ matrix.target }}
        run: nix build .#${{ matrix.target }} --print-build-logs

      - name: Run checks
        run: nix flake check --print-build-logs

      - name: Test native
        if: matrix.target == 'libumem'
        run: nix run .#test-native

      - name: Test RISC-V with QEMU
        if: matrix.target == 'libumem-riscv64'
        run: nix run .#test-riscv64

      - name: Test aarch64 with QEMU
        if: matrix.target == 'libumem-aarch64'
        run: nix run .#test-aarch64
